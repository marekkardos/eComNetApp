version: '3.4'

services:
  api:
    image: ${DOCKER_REGISTRY-}api
    build:
      context: .
      dockerfile: Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnectionMssql=Server=dbserver,1433;Database=eCommNetDb;User Id=sa;Password=Strong!Passw0rd;TrustServerCertificate=True
      - ConnectionStrings__IdentityConnectionMssql=Server=dbserver,1433;Database=eCommNet_IdentityDb;User Id=sa;Password=Strong!Passw0rd;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - AllowedOrigins=http://localhost:4200,http://angular:4200
      - OPEN_TELEMETRY__ENDPOINT=http://aspire-dashboard:18889
      - Seq__ServerUrl=http://seq:5341
    ports:
      - "44369:80"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    depends_on:
      - dbserver
      - redis
      - aspire-dashboard
      - seq
    networks:
      - api-network

  angular:
    profiles: ["backend-dev"]
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
    ports:
      - "4200:4200"
    volumes:
      # Mount source for hot reload
      - ./client:/app
      # Preserve container's node_modules
      - /app/node_modules
    depends_on:
      - api
    networks:
      - api-network

  dbserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "Strong!Passw0rd"
      ACCEPT_EULA: "Y" 
    volumes: 
      - .data/MSSQL2019-DATA:/var/opt/mssql/data
    networks:
      - api-network
      
  redis:
    image: redis
    ports:
      - "6379:6379"
    networks:
      - api-network

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888"  # Dashboard UI
      - "18889:18889"  # OTLP gRPC endpoint
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    networks:
      - api-network

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:5341"  # Ingestion API
      - "8081:80"    # Web UI
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - .data/seq-data:/data
    networks:
      - api-network

networks:
  api-network:
    driver: bridge