# Docker Compose Override Example
# Copy this file to docker-compose.override.yml and uncomment the section for your platform.
# docker-compose.override.yml is gitignored and automatically merged when running docker-compose up.

services:
  api:
    environment:
      - ASPNETCORE_Kestrel__Certificates__Default__Password=...
      - ConnectionStrings__DefaultConnectionMssql=...
      - ConnectionStrings__IdentityConnectionMssql=...
    volumes:
      # macOS / Linux:
      - ${HOME}/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
      - ${HOME}/ASP.NET/https:/https:ro

      # Windows:
      # - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      # - ${APPDATA}/ASP.NET/https:/https:ro

