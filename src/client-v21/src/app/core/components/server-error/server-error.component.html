<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="text-center max-w-2xl">
    <div class="text-9xl font-bold text-red-300 mb-4">500</div>
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Server Error</h1>
    
    @if (error) {
      <div class="bg-white border border-red-200 rounded-lg p-6 mb-6 text-left shadow-sm">
        <h2 class="text-lg font-semibold text-red-600 mb-2">Error Details</h2>
        <p class="text-gray-700 mb-4">{{ errorMessage }}</p>
        
        @if (error.details) {
          <div class="bg-gray-100 rounded p-4 text-sm text-gray-600 font-mono">
            {{ errorDetails }}
          </div>
        }
      </div>
    } @else {
      <p class="text-gray-600 mb-8">An unexpected error occurred on our servers. Our team has been notified.</p>
    }
    
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button
        (click)="window.location.reload()"
        class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-teal-600 text-white rounded hover:bg-teal-700 transition-colors font-medium">
        <span class="material-icons">refresh</span>
        <span>Try Again</span>
      </button>
      <a
        routerLink="/shop"
        class="inline-flex items-center justify-center gap-2 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded hover:bg-gray-50 transition-colors font-medium">
        <span class="material-icons">shopping_bag</span>
        <span>Back to Shop</span>
      </a>
    </div>
  </div>
</div>
